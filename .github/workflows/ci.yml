name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq
      - name: shellcheck
        run: shellcheck bin/sched gate/gate.sh
      - name: tests
        run: bash test/run.sh
